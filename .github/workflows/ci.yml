name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo test --doc
        run: cargo test --doc

  test-integration:
    name: Integration (live Keycloak)
    runs-on: ubuntu-latest
    env:
      KEYSTATE_TEST_DB_URL: postgres://keycloak:keycloak@localhost:5432/keycloak
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Keycloak + Postgres
        run: docker compose up -d --wait --wait-timeout 300
      - name: cargo test (integration)
        run: cargo test --test integration -- --ignored
      - name: Stop stack
        if: always()
        run: docker compose down -v

  import-test:
    name: Import golden files (config-cli round-trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Keycloak + Postgres
        run: docker compose up -d --wait --wait-timeout 300
      - name: Import every file in contrib/example-config
        run: |
          for f in contrib/example-config/*.json; do
            echo "== Importing ${f} =="
            docker run --rm --network host \
              -e KEYCLOAK_URL=http://localhost:8080 \
              -e KEYCLOAK_USER=admin \
              -e KEYCLOAK_PASSWORD=admin \
              -e IMPORT_FILES_LOCATIONS="/config/$(basename "$f")" \
              -v "$PWD/contrib/example-config:/config:ro" \
              adorsys/keycloak-config-cli:latest
          done
      - name: Stop stack
        if: always()
        run: docker compose down -v

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: License / dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: embarkStudios/cargo-deny-action@v2

  features:
    name: No preserve_order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ensure serde_json preserve_order is not enabled
        run: |
          if cargo tree -e features | grep -q "preserve_order"; then
            echo "::error::serde_json 'preserve_order' is enabled — it silently changes canonical byte ordering."
            cargo tree -e features -i serde_json
            exit 1
          fi