[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Temporary: keystate-core and keystate-adapter-keycloak are consumed from
# git until they are published to crates.io. Remove each entry once the
# Cargo.toml dependency points at the registry.
allow-git = [
    "https://github.com/KeyState/keystate-core",
    "https://github.com/KeyState/keystate-adapter-keycloak",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "Zlib",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
]