[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Permanent: keystate-cli is not published to crates.io, so core and the
# adapter are always consumed from git. Keep these entries in sync with the
# Cargo.toml git dependencies.
allow-git = [
    "https://github.com/KeyState/keystate-core",
    "https://github.com/KeyState/keystate-adapter-keycloak",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "Zlib",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
]